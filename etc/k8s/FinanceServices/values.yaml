# auth-server sub-chart override
authserver:
    config:
        selfUrl: https://financeservices-st-authserver
        corsOrigins: https://financeservices-st-gateway-web,https://financeservices-st-gateway-web-public,https://financeservices-st-identity,https://financeservices-st-administration,https://financeservices-st-saas,https://financeservices-st-product
        allowedRedirectUrls: https://financeservices-st-angular
        identityService:
            connString: "Server=financeservices-st-sqldb,1433;Database=FinanceServices_Identity;User Id=sa;password=myPassw@rd"
        administrationService:
            connString: "Server=financeservices-st-sqldb,1433;Database=FinanceServices_Administration;User Id=sa;password=myPassw@rd"
        saasService:
            connString: "Server=financeservices-st-sqldb,1433;Database=FinanceServices_Saas;User Id=sa;password=myPassw@rd"
        authServer:
            authority: http://financeservices-st-authserver
            requireHttpsMetadata: "false"
        dotnetEnv: Staging
        redisHost: financeservices-st-redis
        rabbitmqHost: financeservices-st-rabbitmq
        elasticsearchUrl: http://financeservices-st-elasticsearch
    ingress:
        host: financeservices-st-authserver
    image:
        repository: abpvnext/financeservices-app-authserver
        tag: latest

# identity-service sub-chart override
identity:
    config:
        selfUrl: https://financeservices-st-identity
        corsOrigins: https://financeservices-st-gateway-web
        connectionStrings:
            identityService: "Server=financeservices-st-sqldb,1433;Database=FinanceServices_Identity;User Id=sa;password=myPassw@rd"
            administrationService: "Server=financeservices-st-sqldb,1433;Database=FinanceServices_Administration;User Id=sa;password=myPassw@rd"
            saasService: "Server=financeservices-st-sqldb,1433;Database=FinanceServices_Saas;User Id=sa;password=myPassw@rd"
        authServer:
            authority: http://financeservices-st-authserver
            requireHttpsMetadata: "false"
        dotnetEnv: Staging
        redisHost: financeservices-st-redis
        rabbitmqHost: financeservices-st-rabbitmq
        elasticsearchUrl: http://financeservices-st-elasticsearch
    identityServerClients: # Seeded Clients
        authServerRootUrl: https://financeservices-st-authserver/
        angularRootUrl: https://financeservices-st-angular/
        webRootUrl: https://financeservices-st-web/
        blazorRootUrl: https://financeservices-st-blazor/
        blazorServerRootUrl: https://financeservices-st-blazor-server/
        publicWebRootUrl: https://financeservices-st-public-web/
        webGatewayRootUrl: https://financeservices-st-gateway-web/
        publicWebGatewayRootUrl: https://financeservices-st-gateway-web-public/
        administrationServiceRootUrl: https://financeservices-st-administration/
        identityServiceRootUrl: https://financeservices-st-identity/
        saasServiceRootUrl: https://financeservices-st-saas/
        productServiceRootUrl: https://financeservices-st-product/
    ingress:
        host: financeservices-st-identity
    image:
        repository: abpvnext/financeservices-service-identity
        tag: latest

# administration-service sub-chart override
administration:
    config:
        selfUrl: https://financeservices-st-administration
        gatewayUrl: https://financeservices-st-gateway-internal/
        corsOrigins: https://financeservices-st-gateway-web,https://financeservices-st-gateway-web-public
        connectionStrings:
            administrationService: "Server=financeservices-st-sqldb,1433;Database=FinanceServices_Administration;User Id=sa;password=myPassw@rd"
            saasService: "Server=financeservices-st-sqldb,1433;Database=FinanceServices_Saas;User Id=sa;password=myPassw@rd"
        authServer:
            authority: http://eshop-st-authserver
            requireHttpsMetadata: "false"
        dotnetEnv: Staging
        redisHost: financeservices-st-redis
        rabbitmqHost: financeservices-st-rabbitmq
        elasticsearchUrl: http://financeservices-st-elasticsearch
    synchedCommunication: # Used for server-to-server (client-credentials) communication with identityService for user permissions
        authority: https://financeservices-st-authserver
    ingress:
        host: financeservices-st-administration
    image:
        repository: abpvnext/financeservices-service-administration
        tag: latest

