# gateway-web sub-chart override
gateway-web:
    config:
        selfUrl: https://financeservices-st-gateway-web
        corsOrigins: https://financeservices-st-angular
        globalConfigurationBaseUrl: http://financeservices-st-gateway-web
        authServer:
            authority: http://financeservices-st-authserver
            requireHttpsMetadata: "false"
        dotnetEnv: Staging
        redisHost: financeservices-st-redis
        rabbitmqHost: financeservices-st-rabbitmq
        elasticsearchUrl: http://financeservices-st-elasticsearch
    reRoutes:
        authserver:
            dns: https://authserver.financeservices.dev
            schema: http
            host: financeservices-st-authserver
            port: 80
        identityService:
            dns: https://identity.financeservices.dev
            schema: http
            host: financeservices-st-identity
            port: 80
        administrationService:
            dns: https://administration.financeservices.dev
            schema: http
            host: financeservices-st-administration
            port: 80
        saasService:
            dns: https://saas.financeservices.dev
            schema: http
            host: financeservices-st-saas
            port: 80
        productService:
            dns: https://product.financeservices.dev
            schema: http
            host: financeservices-st-product
            port: 80
    ingress:
        host: financeservices-st-gateway-web
    image:
        repository: abpvnext/financeservices-gateway-web
        tag: latest
        pullPolicy: IfNotPresent

